<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">MWA - My Wellness Approach</title>
  <desc id="desc">Reprodução vetorial restaurada da marca MWA, com figura humana orgânica em verde e dourado.</desc>
  <defs>
    <linearGradient id="goldSymbol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9D762A"/>
      <stop offset=".46" stop-color="#E3C46F"/>
      <stop offset=".72" stop-color="#C49B42"/>
      <stop offset="1" stop-color="#8E6926"/>
    </linearGradient>
    <linearGradient id="goldType" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B762E"/>
      <stop offset=".48" stop-color="#D8B65F"/>
      <stop offset="1" stop-color="#A47A31"/>
    </linearGradient>
    <linearGradient id="tagline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#073D2D"/>
      <stop offset=".43" stop-color="#164B38"/>
      <stop offset=".56" stop-color="#A17A32"/>
      <stop offset="1" stop-color="#C29A50"/>
    </linearGradient>
  </defs>

  <!-- Emblema restaurado -->
  <g transform="translate(0 4)">
    <!-- arco verde esquerdo -->
    <path d="M600 131 C451 127 337 236 334 385 C331 510 399 612 514 664 C388 629 297 518 297 384 C297 226 427 101 585 112 C603 113 622 117 641 124 C626 124 612 126 600 131Z" fill="#073D2D"/>
    <!-- arco dourado direito -->
    <path d="M725 195 C784 275 800 373 769 463 C740 549 674 620 581 653 C681 632 762 562 798 468 C835 369 810 258 725 195Z" fill="url(#goldSymbol)"/>

    <!-- movimento verde / lado esquerdo da pessoa -->
    <path d="M438 221 C449 287 493 318 530 363 C571 412 596 470 589 542 C584 597 560 640 526 680 C543 628 534 581 507 536 C478 487 445 448 423 397 C397 337 399 274 407 221 C412 250 423 278 443 304 C466 335 500 356 523 389 C478 352 444 300 438 221Z" fill="#073D2D"/>

    <!-- movimento dourado / lado direito da pessoa -->
    <path d="M606 575 C597 514 611 454 642 404 C675 350 717 314 737 255 C747 225 749 197 746 171 C774 241 748 310 707 364 C666 419 628 473 606 575Z" fill="url(#goldSymbol)"/>

    <!-- cabeça -->
    <circle cx="563" cy="248" r="42" fill="#073D2D"/>
  </g>

  <!-- Wordmark fiel à composição original -->
  <g aria-label="MWA" font-family="Baskerville, Baskerville Old Face, Libre Baskerville, Georgia, serif" font-size="276" font-weight="400">
    <text x="188" y="907" fill="#073D2D" letter-spacing="-13">M</text>
    <text x="447" y="907" fill="url(#goldType)" letter-spacing="-18">W</text>
    <text x="756" y="907" fill="#073D2D">A</text>
  </g>

  <!-- Assinatura -->
  <text x="194" y="1010" text-anchor="start" fill="url(#tagline)"
        textLength="756" lengthAdjust="spacing"
        font-family="Avenir Next, Montserrat, Century Gothic, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="6">
    MY WELLNESS APPROACH
  </text>
</svg>

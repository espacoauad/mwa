<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">MWA — My Wellness Approach</title>
  <desc id="desc">Marca premium com símbolo de quatro caminhos em crescimento, wordmark MWA e assinatura My Wellness Approach.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0C28F"/>
      <stop offset=".52" stop-color="#C49B62"/>
      <stop offset="1" stop-color="#A9793E"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: quatro pilares convergem para uma trajetória ascendente. -->
  <g transform="translate(120 88)">
    <circle cx="260" cy="260" r="211" fill="none" stroke="#344528" stroke-width="9" stroke-linecap="round" stroke-dasharray="1145 182" transform="rotate(114 260 260)"/>
    <circle cx="260" cy="260" r="187" fill="none" stroke="#879B55" stroke-width="2" opacity=".5" stroke-dasharray="980 195" transform="rotate(122 260 260)"/>

    <!-- Quatro folhas/caminhos = mentalidade, nutrição, rotina, acompanhamento -->
    <path d="M258 401C228 337 179 296 141 217c63 17 112 60 128 119 7 26 4 48-11 65Z" fill="#344528"/>
    <path d="M264 401c31-65 80-106 118-184-63 16-112 59-128 118-7 26-4 49 10 66Z" fill="url(#gold)"/>
    <path d="M253 401c-9-65-39-124-91-169 67 26 106 73 107 139 0 13-5 23-16 30Z" fill="#263219" opacity=".82"/>
    <path d="M270 401c9-65 39-124 91-169-67 26-106 73-107 139 0 13 5 23 16 30Z" fill="#D4AF7A" opacity=".9"/>

    <!-- Centro consciente / pessoa -->
    <circle cx="261" cy="183" r="26" fill="#F5F1E8" stroke="#344528" stroke-width="8"/>
    <circle cx="261" cy="183" r="8" fill="#C49B62"/>

    <!-- Linha de permanência: o crescimento continua além do ciclo -->
    <path d="M259 402C271 344 305 288 359 243" fill="none" stroke="#F5F1E8" stroke-width="5" stroke-linecap="round" opacity=".82"/>
    <path d="M258 402c-11-57-45-113-99-158" fill="none" stroke="#879B55" stroke-width="4" stroke-linecap="round" opacity=".76"/>
    <circle cx="409" cy="93" r="8" fill="#C49B62"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(660 186)">
    <text x="0" y="246" fill="#263219" font-family="Cormorant Garamond, Lora, Georgia, serif" font-size="260" font-weight="500" letter-spacing="10">M</text>
    <text x="267" y="246" fill="url(#gold)" font-family="Cormorant Garamond, Lora, Georgia, serif" font-size="260" font-weight="500" letter-spacing="10">W</text>
    <text x="565" y="246" fill="#263219" font-family="Cormorant Garamond, Lora, Georgia, serif" font-size="260" font-weight="500">A</text>
    <line x1="8" y1="300" x2="765" y2="300" stroke="#C49B62" stroke-width="2"/>
    <text x="15" y="369" fill="#344528" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="37" font-weight="500" letter-spacing="15">MY WELLNESS APPROACH</text>
    <text x="17" y="427" fill="#6F7A66" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="4">CONSCIÊNCIA • EQUILÍBRIO • PERMANÊNCIA</text>
  </g>
</svg>
